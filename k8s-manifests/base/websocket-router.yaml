apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-router
  namespace: orbit-system
  labels:
    app: websocket-router
    component: router
spec:
  replicas: 2  # 2 replicas for load distribution
  selector:
    matchLabels:
      app: websocket-router
  template:
    metadata:
      labels:
        app: websocket-router
        component: router
    spec:
      tolerations:
        - key: node-role
          value: system
          effect: NoSchedule
      nodeSelector:
        role: system
      containers:
      - name: router
        image: gcr.io/PROJECT_ID/websocket-router:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: websocket
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        resources:
          limits:
            cpu: 600m      # Optimized for 25 WebSocket connections per replica
            memory: 256Mi  # 256MB for connection state and kubectl operations
          requests:
            cpu: 250m      # Higher request due to WebSocket overhead
            memory: 128Mi  # Baseline memory for connections
        env:
        - name: PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9090"
        - name: MAX_CONNECTIONS
          value: "50"     # Max 50 concurrent WebSocket connections
        - name: KUBERNETES_NAMESPACE
          value: "orbit-challenges"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: orbit-secrets
              key: jwt-secret
        - name: LOG_LEVEL
          value: "info"
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: websocket-router
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-router
  namespace: orbit-system
  labels:
    app: websocket-router
    component: router
spec:
  type: ClusterIP
  ports:
  - name: websocket
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: websocket-router
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-router-hpa
  namespace: orbit-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket-router
  minReplicas: 2
  maxReplicas: 5  # Scale up to 5 replicas for high WebSocket load
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: websocket-router
  namespace: orbit-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: websocket-router-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: websocket-router-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: websocket-router-role
subjects:
- kind: ServiceAccount
  name: websocket-router
  namespace: orbit-system
