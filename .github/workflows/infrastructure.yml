name: 'Infrastructure Pipeline'

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - 'k8s-manifests/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'validate-setup'
        type: choice
        options:
          - validate-setup
          - plan
          - apply
          - apply-direct
          - plan-and-apply
          - k8s-deploy
          - pause
          - resume
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TF_VERSION: '1.5.0'
  KUBECTL_VERSION: '1.28.0'
  GCP_REGION: 'us-central1'
  CLUSTER_NAME: 'orbit-challenge-cluster'
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  workflow-info:
    name: 'Workflow Information'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Workflow Triggered
        run: |
          echo "🚀 Infrastructure Pipeline Workflow Updated!"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "ℹ️  To run infrastructure operations:"
          echo "1. Go to Actions tab"
          echo "2. Click 'Infrastructure Pipeline'"
          echo "3. Click 'Run workflow'"
          echo "4. Select action (validate-setup, plan, apply, etc.)"
          echo ""
          echo "🔗 Direct link: https://github.com/${{ github.repository }}/actions/workflows/infrastructure.yml"

  validate-setup:
    name: 'Validate GCP Setup & Service Account'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'validate-setup'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GitHub Secrets
        run: |
          echo "🔍 Verifying GitHub secrets configuration..."
          
          if [[ -n "$GCP_PROJECT_ID" ]]; then
            echo "✅ GCP_PROJECT_ID is set: $GCP_PROJECT_ID"
          else
            echo "❌ GCP_PROJECT_ID secret not found!"
            exit 1
          fi
          
          if [[ -n "$TF_STATE_BUCKET" ]]; then
            echo "✅ TF_STATE_BUCKET is set: $TF_STATE_BUCKET"
          else
            echo "❌ TF_STATE_BUCKET secret not found!"
            exit 1
          fi
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Verify Service Account Permissions
        run: |
          echo "🔍 Verifying service account permissions..."
          
          # Check if we can list projects
          gcloud projects list --limit=1 > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Service account can access Google Cloud projects"
          else
            echo "❌ Service account cannot access Google Cloud projects"
            exit 1
          fi
          
          # Check compute engine API
          gcloud services list --enabled --filter="name:compute.googleapis.com" --format="value(name)" | grep -q compute.googleapis.com
          if [ $? -eq 0 ]; then
            echo "✅ Compute Engine API is enabled"
          else
            echo "⚠️  Compute Engine API is not enabled"
          fi
          
          # Check container API
          gcloud services list --enabled --filter="name:container.googleapis.com" --format="value(name)" | grep -q container.googleapis.com
          if [ $? -eq 0 ]; then
            echo "✅ Kubernetes Engine API is enabled"
          else
            echo "⚠️  Kubernetes Engine API is not enabled"
          fi

      - name: Verify Terraform State Bucket
        run: |
          echo "🔍 Verifying Terraform state bucket..."
          
          gsutil ls gs://${{ secrets.TF_STATE_BUCKET }} > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Terraform state bucket exists and is accessible"
          else
            echo "❌ Terraform state bucket not found or not accessible"
            echo "Please ensure bucket exists: gs://${{ secrets.TF_STATE_BUCKET }}"
            exit 1
          fi

      - name: Setup Complete
        run: |
          echo "🎉 Setup validation completed successfully!"
          echo ""
          echo "✅ GitHub secrets are configured"
          echo "✅ Service account has proper permissions"
          echo "✅ Terraform state bucket is accessible"
          echo ""
          echo "You can now run other workflow actions:"
          echo "- plan: Generate Terraform execution plan"
          echo "- apply: Deploy infrastructure"
          echo "- k8s-deploy: Deploy Kubernetes manifests"
          echo "- destroy: Remove all infrastructure"

  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'plan-and-apply')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          echo "🔧 Initializing Terraform with backend configuration..."
          
          # Try normal init first
          if terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}"; then
            echo "✅ Terraform initialized successfully"
          else
            echo "⚠️ Backend configuration changed, attempting migration..."
            # If init fails due to backend config change, try with migrate-state
            terraform init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}" \
              -migrate-state \
              -input=false
            echo "✅ Terraform initialized with state migration"
          fi
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -out=tfplan
        working-directory: infrastructure/terraform

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: infrastructure/terraform/tfplan
          retention-days: 5

  apply:
    name: 'Terraform Apply (with Plan)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.action == 'apply' || github.event.inputs.action == 'plan-and-apply') &&
      needs.plan.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          echo "🔧 Initializing Terraform with backend configuration..."
          
          # Try normal init first
          if terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}"; then
            echo "✅ Terraform initialized successfully"
          else
            echo "⚠️ Backend configuration changed, attempting migration..."
            # If init fails due to backend config change, try with migrate-state
            terraform init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}" \
              -migrate-state \
              -input=false
            echo "✅ Terraform initialized with state migration"
          fi
        working-directory: infrastructure/terraform

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: infrastructure/terraform

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: infrastructure/terraform

  terraform-apply-direct:
    name: 'Terraform Apply (Direct)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'apply-direct'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          echo "🔧 Initializing Terraform with backend configuration..."
          
          # Try normal init first
          if terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}"; then
            echo "✅ Terraform initialized successfully"
          else
            echo "⚠️ Backend configuration changed, attempting migration..."
            # If init fails due to backend config change, try with migrate-state
            terraform init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}" \
              -migrate-state \
              -input=false
            echo "✅ Terraform initialized with state migration"
          fi
        working-directory: infrastructure/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -auto-approve
        working-directory: infrastructure/terraform

  k8s-deploy:
    name: 'Deploy Kubernetes Manifests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'k8s-deploy'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Kubernetes Manifests
        run: |
          echo "🚀 Deploying Kubernetes manifests..."
          
          # Apply base manifests
          kubectl apply -f k8s-manifests/base/
          
          # Wait for deployments to be ready
          kubectl rollout status deployment/orbit-backend -n default --timeout=300s
          kubectl rollout status deployment/orbit-operator -n default --timeout=300s
          kubectl rollout status deployment/websocket-router -n default --timeout=300s
          
          echo "✅ Kubernetes deployment completed!"

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          kubectl get pods
          kubectl get services
          kubectl get deployments

  pause:
    name: 'Pause Infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'pause'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check Cluster Exists
        run: |
          echo "🔍 Checking if cluster exists..."
          if gcloud container clusters describe ${{ env.CLUSTER_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "✅ Cluster found: ${{ env.CLUSTER_NAME }}"
            echo "CLUSTER_EXISTS=true" >> $GITHUB_ENV
          else
            echo "❌ Cluster not found: ${{ env.CLUSTER_NAME }}"
            echo "CLUSTER_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Pause Infrastructure
        if: env.CLUSTER_EXISTS == 'true'
        run: |
          echo "⏸️ Pausing infrastructure to save costs..."
          
          # Get list of node pools
          NODE_POOLS=$(gcloud container node-pools list \
            --cluster=${{ env.CLUSTER_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(name)" 2>/dev/null || echo "")
          
          if [ -z "$NODE_POOLS" ]; then
            echo "❌ No node pools found or cluster doesn't exist"
            exit 1
          fi
          
          echo "📋 Found node pools: $NODE_POOLS"
          
          # Scale down each node pool to 0
          for pool in $NODE_POOLS; do
            echo "⏸️ Scaling down node pool: $pool"
            gcloud container clusters resize ${{ env.CLUSTER_NAME }} \
              --region ${{ env.GCP_REGION }} \
              --node-pool $pool \
              --num-nodes 0 \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --quiet || echo "⚠️ Failed to scale down $pool (may already be scaled)"
          done
          
          echo "✅ Infrastructure paused successfully!"
          echo "💰 All node pools scaled to 0 to save costs"

      - name: Cluster Not Found
        if: env.CLUSTER_EXISTS == 'false'
        run: |
          echo "ℹ️ No cluster found to pause"
          echo "Either the cluster doesn't exist or has already been destroyed"
          echo "Current project: ${{ secrets.GCP_PROJECT_ID }}"
          echo "Expected cluster: ${{ env.CLUSTER_NAME }}"

  resume:
    name: 'Resume Infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'resume'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check Cluster Exists
        run: |
          echo "🔍 Checking if cluster exists..."
          if gcloud container clusters describe ${{ env.CLUSTER_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "✅ Cluster found: ${{ env.CLUSTER_NAME }}"
            echo "CLUSTER_EXISTS=true" >> $GITHUB_ENV
          else
            echo "❌ Cluster not found: ${{ env.CLUSTER_NAME }}"
            echo "CLUSTER_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Resume Infrastructure
        if: env.CLUSTER_EXISTS == 'true'
        run: |
          echo "▶️ Resuming infrastructure..."
          
          # Get list of node pools and their configurations
          NODE_POOLS=$(gcloud container node-pools list \
            --cluster=${{ env.CLUSTER_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="csv[no-heading](name)" 2>/dev/null || echo "")
          
          if [ -z "$NODE_POOLS" ]; then
            echo "❌ No node pools found"
            exit 1
          fi
          
          echo "📋 Found node pools: $NODE_POOLS"
          
          # Resume system pool (if exists)
          if echo "$NODE_POOLS" | grep -q "system-pool"; then
            echo "▶️ Resuming system-pool to 2 nodes..."
            gcloud container clusters resize ${{ env.CLUSTER_NAME }} \
              --region ${{ env.GCP_REGION }} \
              --node-pool system-pool \
              --num-nodes 2 \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --quiet || echo "⚠️ Failed to resume system-pool"
          fi
          
          # Resume challenge pool (if exists)
          if echo "$NODE_POOLS" | grep -q "challenge-pool"; then
            echo "▶️ Resuming challenge-pool to 10 nodes..."
            gcloud container clusters resize ${{ env.CLUSTER_NAME }} \
              --region ${{ env.GCP_REGION }} \
              --node-pool challenge-pool \
              --num-nodes 10 \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --quiet || echo "⚠️ Failed to resume challenge-pool"
          fi
          
          # Resume any other pools to 1 node minimum
          for pool in $NODE_POOLS; do
            if [ "$pool" != "system-pool" ] && [ "$pool" != "challenge-pool" ]; then
              echo "▶️ Resuming $pool to 1 node..."
              gcloud container clusters resize ${{ env.CLUSTER_NAME }} \
                --region ${{ env.GCP_REGION }} \
                --node-pool $pool \
                --num-nodes 1 \
                --project ${{ secrets.GCP_PROJECT_ID }} \
                --quiet || echo "⚠️ Failed to resume $pool"
            fi
          done
          
          echo "✅ Infrastructure resumed successfully!"
          echo "🚀 Node pools scaled back to operational levels"

      - name: Cluster Not Found
        if: env.CLUSTER_EXISTS == 'false'
        run: |
          echo "ℹ️ No cluster found to resume"
          echo "You may need to run 'apply' action first to create the infrastructure"
          echo "Current project: ${{ secrets.GCP_PROJECT_ID }}"
          echo "Expected cluster: ${{ env.CLUSTER_NAME }}"

  destroy:
    name: 'Destroy Infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'destroy'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          echo "🔧 Initializing Terraform with backend configuration..."
          
          # For destroy, we want to try to reconfigure if there's a backend change
          # since we need to work with whatever state exists
          if terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}"; then
            echo "✅ Terraform initialized successfully"
          else
            echo "⚠️ Backend configuration changed, reconfiguring..."
            # For destroy, use reconfigure to work with current state
            terraform init \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}" \
              -reconfigure \
              -input=false
            echo "✅ Terraform initialized with reconfiguration"
          fi
        working-directory: infrastructure/terraform

      - name: Confirm Destruction
        run: |
          echo "⚠️ DESTROYING INFRASTRUCTURE FOR ENVIRONMENT: ${{ env.ENVIRONMENT }}"
          echo "Project: ${{ secrets.GCP_PROJECT_ID }}"
          echo "Region: ${{ env.GCP_REGION }}"
          echo "Cluster: ${{ env.CLUSTER_NAME }}"
          echo "This action cannot be undone!"
          echo ""
          echo "🔍 Checking current resources..."
          
          # Check if cluster exists
          if gcloud container clusters describe ${{ env.CLUSTER_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "📋 Found cluster: ${{ env.CLUSTER_NAME }}"
            gcloud container node-pools list \
              --cluster=${{ env.CLUSTER_NAME }} \
              --region=${{ env.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --format="table(name,initialNodeCount,machineType)" || true
          else
            echo "ℹ️ Cluster not found - may already be destroyed"
          fi

      - name: Terraform Destroy
        run: |
          echo "🗄️ Starting Terraform destroy with all required variables..."
          terraform destroy \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="zone=us-central1-a" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="cluster_name=${{ env.CLUSTER_NAME }}" \
            -var="system_node_count=2" \
            -var="system_node_machine_type=e2-standard-2" \
            -var="challenge_node_count=10" \
            -var="challenge_node_machine_type=e2-standard-4" \
            -var="network_name=orbit-vpc" \
            -var="subnet_name=orbit-subnet" \
            -var="subnet_cidr=10.0.0.0/16" \
            -var="system_auto_scaling_min=2" \
            -var="system_auto_scaling_max=2" \
            -var="challenge_auto_scaling_min=5" \
            -var="challenge_auto_scaling_max=11" \
            -var="max_challenge_pods=50" \
            -var="challenge_ttl=30m" \
            -var="challenge_cpu_limit=500m" \
            -var="challenge_memory_limit=512Mi" \
            -var="total_cpu_budget=50" \
            -var="system_cpu_allocation=4" \
            -var="max_challenge_cpu_allocation=44" \
            -var="enable_preemptible=true" \
            -var="github_actions_sa_email=orbit-github-actions@smart-pipeline.iam.gserviceaccount.com" \
            -auto-approve
        working-directory: infrastructure/terraform
        
      - name: Cleanup Complete
        run: |
          echo "✅ Infrastructure destroyed successfully!"
          echo "💰 All resources have been removed"
          echo ""
          echo "🔍 Verifying cleanup..."
          
          # Verify major resources are gone
          echo "Checking for remaining cluster..."
          if gcloud container clusters describe ${{ env.CLUSTER_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "⚠️ Cluster still exists"
          else
            echo "✅ Cluster destroyed"
          fi
          
          echo "Checking for remaining VPC networks..."
          VPC_COUNT=$(gcloud compute networks list \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --filter="name:*orbit*" \
            --format="value(name)" | wc -l)
          if [ "$VPC_COUNT" -eq 0 ]; then
            echo "✅ VPC networks destroyed"
          else
            echo "⚠️ Some VPC networks may still exist"
          fi
          
          echo "🎯 Destruction verification complete"
